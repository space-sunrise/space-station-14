name: Build & Test Debug

on:
  push:
    branches: [ master ]
  merge_group:
  pull_request:
    types: [ opened, reopened, synchronize ]
    branches: [ master ]

# Sunrise added start - отменяем устаревший запуск этой проверки для того же PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# Sunrise added end

jobs:
  build:
    if: github.actor != 'Sunrise-Bot'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Master
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: |
        git submodule update --init --recursive

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: |
        cd RobustToolbox/
        git submodule update --init --recursive

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: dotnet restore

    - name: Build Project
      run: dotnet build --configuration DebugOpt --no-restore /m

    - name: Discover Integration Tests
      shell: bash
      run: |
        # Sunrise-Edit - полные имена разделяют одноимённые методы разных тестовых классов
        dotnet test --list-tests --no-build --no-restore --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj -- NUnit.DisplayName=FullName 2>&1 | \
          python3 Tools/test_shard_filter.py generate 8 .integration-filters

    - name: Archive build output
      # Sunrise-Edit - быстрее передаём сборку тестовым шардам через многопоточный zstd
      run: tar -I 'zstd -T0 -3' -cf /tmp/build.tar.zst --exclude='.git' .

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-output
        path: /tmp/build.tar.zst
        retention-days: 1
        compression-level: 0

  content-tests:
    needs: build
    name: Content Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Extract build
      # Sunrise-Edit - распаковываем zstd-архив сборки
      run: tar --zstd -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.Tests/Content.Tests.csproj

    - name: Run Content.Tests
      id: content-tests-retry
      uses: nick-fields/retry@v3
      with:
        timeout_minutes: 15
        max_attempts: 2
        command: dotnet test --no-build --no-restore --configuration DebugOpt Content.Tests/Content.Tests.csproj --logger "trx;LogFileName=results.trx" --results-directory /tmp/test-results

    # Sunrise-Edit
    - name: Mark Content.Tests flake
      if: success() && steps.content-tests-retry.outputs.total_attempts != '1'
      run: |
        echo "::warning title=Flaky Content.Tests::Content.Tests passed on retry after ${{ steps.content-tests-retry.outputs.total_attempts }} attempts."
        echo "## :warning: Flaky Content.Tests" >> "$GITHUB_STEP_SUMMARY"
        echo "Passed on retry after ${{ steps.content-tests-retry.outputs.total_attempts }} attempts." >> "$GITHUB_STEP_SUMMARY"

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        mkdir -p /tmp/test-results
        trx --path /tmp/test-results -o -v verbose || true

  integration-tests:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    name: "Integration Tests (shard ${{ matrix.shard }})"
    runs-on: ubuntu-latest
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: build-output

    - name: Extract build
      # Sunrise-Edit - распаковываем zstd-архив сборки
      run: tar --zstd -xf build.tar.zst && rm build.tar.zst

    - name: Restore packages
      run: dotnet restore Content.IntegrationTests/Content.IntegrationTests.csproj

    - name: Run Content.IntegrationTests
      id: integration-tests-retry
      uses: nick-fields/retry@v3
      env:
        DOTNET_gcServer: "1"
      with:
        timeout_minutes: 17
        max_attempts: 2
        retry_on: any
        command: |
          SETTINGS=.integration-filters/shard_${{ matrix.shard }}.runsettings
          timeout --signal=TERM --kill-after=2m 15m \
            dotnet test --no-build --no-restore --configuration DebugOpt Content.IntegrationTests/Content.IntegrationTests.csproj --settings "$SETTINGS" --logger "trx;LogFileName=results.trx" --logger "console;verbosity=normal" --results-directory /tmp/test-results --blame-hang --blame-hang-timeout 3min --blame-hang-dump-type mini

    # Sunrise-Edit
    - name: Mark integration shard flake
      if: success() && steps.integration-tests-retry.outputs.total_attempts != '1'
      run: |
        echo "::warning title=Flaky integration shard::Shard ${{ matrix.shard }} passed on retry after ${{ steps.integration-tests-retry.outputs.total_attempts }} attempts."
        echo "## :warning: Flaky integration shard ${{ matrix.shard }}" >> "$GITHUB_STEP_SUMMARY"
        echo "Passed on retry after ${{ steps.integration-tests-retry.outputs.total_attempts }} attempts." >> "$GITHUB_STEP_SUMMARY"

    - name: Test results
      continue-on-error: true
      if: always()
      run: |
        dotnet tool install -g dotnet-trx 2>/dev/null || true
        mkdir -p /tmp/test-results
        trx --path /tmp/test-results -o -v verbose || true

    # Sunrise added start - последовательность зависания нужна даже после успешного повтора
    - name: Upload hang sequences
      id: upload-sequences
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: blame-sequence-shard-${{ matrix.shard }}
        path: /tmp/test-results/**/*Sequence*.xml
        retention-days: 3
        if-no-files-found: ignore
    # Sunrise added end

    # Sunrise edit start - не загружаем многогигабайтный дамп после успешного повтора
    - name: Upload crash dumps
      id: upload-dumps
      uses: actions/upload-artifact@v4
      if: always() && steps.integration-tests-retry.outcome == 'failure'
      with:
        name: blame-dump-shard-${{ matrix.shard }}
        path: /tmp/test-results/**/*.dmp
        retention-days: 3
        if-no-files-found: ignore
    # Sunrise edit end

    - name: Report hung tests
      continue-on-error: true
      if: always()
      run: |
        shopt -s nullglob globstar
        found=false
        for seq in /tmp/test-results/**/*Sequence*.xml; do
          if [ "$found" = false ]; then
            echo "## :warning: Hung tests detected (shard ${{ matrix.shard }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```xml' >> "$GITHUB_STEP_SUMMARY"
            found=true
          fi
          cat "$seq" >> "$GITHUB_STEP_SUMMARY"
        done
        if [ "$found" = true ]; then
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${{ steps.upload-sequences.outputs.artifact-url }}" ]; then
            echo ":page_facing_up: [Download hang sequence](${{ steps.upload-sequences.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -n "${{ steps.upload-dumps.outputs.artifact-url }}" ]; then
            echo ":floppy_disk: [Download crash dump](${{ steps.upload-dumps.outputs.artifact-url }})" >> "$GITHUB_STEP_SUMMARY"
          fi
        fi

  ci-success:
    name: Build & Test Debug
    needs:
      - build
      - content-tests
      - integration-tests
    # Sunrise-Edit - итоговый статус должен выполниться и явно отразить падение зависимости
    if: ${{ always() && github.actor != 'Sunrise-Bot' }}
    runs-on: ubuntu-latest
    steps:
      # Sunrise edit start - не принимаем skipped/cancelled за успешный обязательный статус
      - name: Verify required jobs
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          CONTENT_TESTS_RESULT: ${{ needs.content-tests.result }}
          INTEGRATION_TESTS_RESULT: ${{ needs.integration-tests.result }}
        run: |
          echo "build=$BUILD_RESULT content-tests=$CONTENT_TESTS_RESULT integration-tests=$INTEGRATION_TESTS_RESULT"
          if [[ "$BUILD_RESULT" != "success" || "$CONTENT_TESTS_RESULT" != "success" || "$INTEGRATION_TESTS_RESULT" != "success" ]]; then
            echo "::error title=Required CI failed::At least one required job did not succeed."
            exit 1
          fi
      # Sunrise edit end

  cleanup:
    name: Cleanup Artifacts
    needs:
      - content-tests
      - integration-tests
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Delete build artifact
        uses: geekyeggo/delete-artifact@v5
        with:
          name: build-output
