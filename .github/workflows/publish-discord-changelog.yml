# Sunrise added start - отдельная публикация чейнжлога в Discord
name: Publish Discord Changelog
run-name: Discord changelog for ${{ github.event.workflow_run.head_sha }}

on:
  workflow_run:
    workflows: ["Publish Stable"]
    types: [completed]
    branches: [stable]

permissions:
  actions: read # Чтение истории запусков для поиска предыдущей публикации.
  contents: read # Чтение файла чейнджлога из опубликованного коммита.

concurrency:
  group: publish-discord-changelog
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout released commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2 requests==2.32.4

      - name: Publish changelog
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.CHANGELOG_DISCORD_WEBHOOK }}
          CHANGELOG_FILE: ${{ vars.CHANGELOG_FILE }}
          SOURCE_WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: python Tools/_sunrise/changelog/actions_changelogs_since_last_run.py
# Sunrise added end
