name: Publish

concurrency:
  group: publish
  cancel-in-progress: true

# Sunrise added start - настраиваем публикацию через переменные GitHub
env:
  PUBLISH_FORK_ID: ${{ vars.PUBLISH_FORK_ID }}
  ROBUST_CDN_URL: ${{ vars.ROBUST_CDN_URL }}
# Sunrise added end

on:
  workflow_dispatch:
  schedule:
  - cron: '0 10 * * *'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
#    - name: Fail if not on master branch
#      if: ${{GITHUB.REF_NAME != 'master'}}
#      run: exit 1

    - name: Set up Python
      uses: actions/setup-python@v2
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: pip install pyyaml requests

    - uses: actions/checkout@v4.2.2
      with:
        submodules: 'recursive'

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Get Engine Tag
      run: |
        cd RobustToolbox
        git fetch --depth=1

    - name: Install dependencies
      run: dotnet restore

    - name: Build Packaging
      run: dotnet build Content.Packaging --configuration Release --no-restore /m

    - name: Package server
      run: dotnet run --project Content.Packaging server --platform win-x64 --platform win-arm64 --platform linux-x64 --platform linux-arm64 --platform osx-x64 --platform osx-arm64

    - name: Package client
      run: dotnet run --project Content.Packaging client --no-wipe-release

    - name: Publish version
      # Sunrise edit start - передаём настраиваемый идентификатор сборки
      run: Tools/publish_multi_request.py --fork-id "${PUBLISH_FORK_ID}"
      # Sunrise edit end
      env:
        PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        GITHUB_REPOSITORY: ${{ vars.GITHUB_REPOSITORY }}
