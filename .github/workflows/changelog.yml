name: Automatic Changelog

on:
  pull_request_target:
    types: [closed]
  push:
    branches: [master]
    paths:
      - "Resources/Changelog/Parts/*.yml"
      - "Resources/Changelog/Parts/**/*.yml"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Номер PR для ручного восстановления. Оставьте пустым для обычной сверки."
        required: false
        type: number
  schedule:
    # Sunrise added - страховочная сверка на случай пропущенного или упавшего события GitHub
    - cron: "17 * * * *"

permissions: {}

jobs:
  update:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.CHANGELOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGELOG_APP_PRIVATE_KEY }}

      # pull_request_target требует выполнять только код из доверенной ветки master.
      - name: Checkout master
        uses: actions/checkout@v4.2.2
        with:
          ref: master
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.2

      - name: Update changelog
        shell: bash
        env:
          CHANGELOG_EXTRA_CATEGORIES: ${{ vars.CHANGELOG_EXTRA_CATEGORIES }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || '' }}
        run: bash Tools/_sunrise/changelog/run.sh
