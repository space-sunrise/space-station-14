name: "PR: Auto Draft on Review Threads"

on:
  workflow_run:
    workflows: ["PR: Review State Changed"]
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, converted_to_draft, ready_for_review]
  workflow_dispatch:
    inputs:
      pr-number:
        description: "PR number to check. Leave empty to scan all open PRs."
        required: false
        type: number
  schedule:
    # Резервная синхронизация нужна для Resolve conversation: у GitHub Actions нет такого триггера.
    - cron: "2/5 * * * *"

permissions: {}

concurrency:
  # ponytail: общая очередь исключает гонки между обходом всех ПР и отдельными событиями.
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

jobs:
  sync-draft-state:
    runs-on: ubuntu-latest
    env:
      AUTO_DRAFT_LABEL: "auto-draft: unresolved review"
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AUTO_DRAFT_APP_CLIENT_ID }}
          private-key: ${{ secrets.AUTO_DRAFT_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Checkout trusted automation script
        uses: actions/checkout@v6
        with:
          # Код берётся из коммита самого workflow; ручной запуск позволяет проверить ветку до мержа.
          ref: ${{ github.workflow_sha }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
          sparse-checkout: Tools/_sunrise/auto_draft/review_threads.js
          sparse-checkout-cone-mode: false
      - name: Sync draft state
        uses: actions/github-script@v9
        env:
          AUTO_DRAFT_APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const run = require(`${process.env.GITHUB_WORKSPACE}/Tools/_sunrise/auto_draft/review_threads.js`);
            await run({ github, context, core });
