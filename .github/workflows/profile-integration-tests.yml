# Sunrise added - ручное измерение времени интеграционных тестов
name: Profile Integration Test Timings

on:
  workflow_dispatch:
    inputs:
      profile_runs:
        description: Количество полных повторов всех интеграционных тестов
        required: true
        default: '20'
        type: choice
        options:
        - '10'
        - '20'
        - '30'
        - '50'
      max_parallel_runners:
        description: Максимальное количество одновременно занятых GitHub-раннеров (1–20)
        required: true
        default: 5
        type: number

permissions:
  contents: read

concurrency:
  group: integration-test-timing-profile
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare profiling matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      max_parallel: ${{ steps.matrix.outputs.max_parallel }}
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Validate inputs and create matrix
      id: matrix
      env:
        PROFILE_RUNS: ${{ inputs.profile_runs }}
        MAX_PARALLEL_RUNNERS: ${{ inputs.max_parallel_runners }}
      run: bash Tools/_sunrise/ci/test_workflow.sh prepare-profile-matrix

  build:
    name: Build and discover tests
    needs: prepare
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Setup Submodule
      run: bash Tools/_sunrise/ci/test_workflow.sh setup-root-submodules

    - name: Pull engine updates
      uses: space-wizards/submodule-dependency@v0.1.5

    - name: Update Engine Submodules
      run: bash Tools/_sunrise/ci/test_workflow.sh setup-engine-submodules

    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Install dependencies
      run: bash Tools/_sunrise/ci/test_workflow.sh restore-integration

    - name: Build Project
      run: bash Tools/_sunrise/ci/test_workflow.sh build-integration

    - name: Discover Integration Tests
      run: bash Tools/_sunrise/ci/test_workflow.sh discover-profile

    - name: Prune build artifact
      run: bash Tools/_sunrise/ci/test_workflow.sh prune-build profile

    - name: Archive build output
      run: bash Tools/_sunrise/ci/test_workflow.sh archive-build profile

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: integration-profile-build
        path: /tmp/integration-profile-build
        retention-days: 1
        compression-level: 0

    - name: Upload discovery artifact
      uses: actions/upload-artifact@v4
      with:
        name: integration-profile-discovery
        path: integration-test-discovery.log
        retention-days: 1

  profile:
    name: Profile run ${{ matrix.profile_run }}
    needs:
    - prepare
    - build
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.prepare.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - name: Setup .NET Core
      uses: actions/setup-dotnet@v4.1.0
      with:
        dotnet-version: 10.0.x

    - name: Download build artifact
      uses: actions/download-artifact@v4
      with:
        name: integration-profile-build

    - name: Extract build
      run: bash Tools/_sunrise/ci/test_workflow.sh extract-build integration-profile-build.tar.zst

    - name: Run Content.IntegrationTests
      id: integration-tests
      continue-on-error: true
      env:
        DOTNET_gcServer: '1'
      run: bash Tools/_sunrise/ci/test_workflow.sh run-profile

    - name: Collect successful durations
      if: always()
      env:
        PROFILE_RUN: ${{ matrix.profile_run }}
      run: bash Tools/_sunrise/ci/test_workflow.sh collect-profile

    - name: Upload compact timing sample
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: integration-timing-run-${{ matrix.profile_run }}
        path: /tmp/integration-timing-${{ matrix.profile_run }}.json
        retention-days: 1
        if-no-files-found: error

  aggregate:
    name: Build timing configuration
    if: always() && needs.build.result == 'success'
    needs:
    - prepare
    - build
    - profile
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4.2.2

    - name: Download discovery
      uses: actions/download-artifact@v4
      with:
        name: integration-profile-discovery

    - name: Download compact timing samples
      uses: actions/download-artifact@v4
      with:
        pattern: integration-timing-run-*
        path: integration-timing-samples
        merge-multiple: true

    - name: Aggregate timing configuration
      env:
        PROFILE_RUNS: ${{ inputs.profile_runs }}
      run: bash Tools/_sunrise/ci/test_workflow.sh aggregate-profile

    - name: Upload timing configuration
      uses: actions/upload-artifact@v4
      with:
        name: integration-test-timings-${{ github.run_id }}
        path: Tools/_sunrise/ci/sharding/integration_test_timings.json
        retention-days: 14
        if-no-files-found: error
