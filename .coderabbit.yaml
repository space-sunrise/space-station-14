language: ru-RU

reviews:
  auto_apply_labels: true
  allow_label_editing: true
  labeling_instructions:
    - label: "🧊 Нет C# 🧊"
      instructions: "Применить, когда PR не содержит изменений в .cs файлах"
    
    - label: "🛠️ Есть C# 🛠️"
      instructions: "Применить, когда PR содержит изменения в .cs файлах"
    
    - label: "📚 Изменения: Локализация 📚"
      instructions: "Применить, когда PR содержит изменения в .ftl файлах локализации"
    
    - label: "🖌️ Спрайты 🖌️"
      instructions: "Применить, когда PR содержит изменения в .png, .jpg, .jpeg, .gif или других графических файлах"
    
    - label: "📦 YAML | Прототип 📦"
      instructions: "Применить, когда PR содержит изменения в .yml или .yaml файлах прототипов"
    
    - label: "🔎 На Рассмотрение 🔎"
      instructions: "Применить к новым PR, которые требуют рассмотрения мейнтейнерами"

    - label: "🪟 Интерфейс 🪟"
      instuctions: "Применить, когда PR содержит изменения в визуальных элементах интерфейса, которые видны пользователю: кнопки, окна, панели, меню и другие компоненты UI"
    
#    - label: "⛔ Нужны правки ⛔"
#      instructions: "Применить, когда по результатам МЕЙНТЕЙНЕРА ИЛИ КОЛЛАБОЛАТОРА ревью выявлены замечания, требующие внесения изменений в код, конфигурации или ресурсы PR."
    
    - label: "🤖 ИИ Заготовка 🤖"
      instructions: "Применить ТОЛЬКО если PR был создан полностью ИИ (GitHub Copilot, ChatGPT, Claude и так далее), о чём прямо указано в описании PR, коммитах или очевидно из автогенерированного характера изменений."


chat:
  auto_reply: true

# ═══════════════════════════════════════════════════════════════════════════
# Примечания
# ═══════════════════════════════════════════════════════════════════════════
# 1. Все метки используют emoji для улучшенной визуализации
# 2. Старые текстовые метки исключены из автоматического применения
# 3. CodeRabbit будет применять только релевантные метки на основе содержимого PR
# 4. Метка "Несортированный" полностью исключена из использования
# ═══════════════════════════════════════════════════════════════════════════
