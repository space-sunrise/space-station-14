# Шаблон цели публикации чейнджлога в Discord.
#
# Этот файл является документацией и не читается реестром автоматически.
# Для добавления цели его следует скопировать в каталог
# Tools/_sunrise/changelog/targets и переименовать, например в fish.yml.
#
# Имя файла без расширения становится идентификатором цели. Оно может содержать
# строчные латинские буквы, цифры и одиночные дефисы. Название проекта не имеет
# специального значения: sunrise.yml, fish.yml и child-fork.yml обрабатываются
# одинаково.

# Относительный путь к YAML-чейнджлогу внутри репозитория.
# Указанный файл должен существовать в публикуемом коммите.
changelog_file: Resources/Changelog/ChangelogFork.yml

# Имя секрета GitHub Actions, содержащего полный адрес вебхука Discord.
# Здесь указывается только имя секрета, а не сам адрес.
# Допустимое имя начинается с CHANGELOG_DISCORD_WEBHOOK_ и содержит
# только заглавные латинские буквы, цифры и символ подчёркивания.
webhook_secret: CHANGELOG_DISCORD_WEBHOOK_FORK

# Секрет с указанным именем добавляется в настройках каждого репозитория,
# который наследует эту цель. Для разных целей следует использовать разные
# секреты и, при необходимости, разные Discord-каналы.
