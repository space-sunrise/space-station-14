- type: entity
  id: TeleportEffect
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 0.4
  - type: Sprite
    drawdepth: Effects
    noRot: true
    layers:
      - shader: unshaded
        map: ["enum.EffectLayers.Unshaded"]
        sprite: Effects/teleport_sparks.rsi
        state: sparks
  - type: EffectVisuals
  - type: Tag
    tags:
      - HideContextMenu
  - type: EmitSoundOnSpawn
    sound:
      path: /Audio/Effects/electrical_short_circuit2.ogg
  - type: AnimationPlayer

- type: entity
  id: TeleportEffectOut
  components:
    - type: TimedDespawn
      lifetime: 0.6
    - type: EvaporationSparkle
    - type: Transform
      noRot: true
      anchored: true
    - type: Sprite
      layers:
        - sprite: /Textures/_White/Objects/Devices/experimentalsyndicateteleporter.rsi
          state: in
          shader: unshaded
      netsync: false
      drawdepth: Effects
    - type: PointLight
      color: "#008DFE"

- type: entity
  id: TeleportEffectIn
  components:
    - type: TimedDespawn
      lifetime: 0.6
    - type: EvaporationSparkle
    - type: Transform
      noRot: true
      anchored: true
    - type: Sprite
      layers:
        - sprite: /Textures/_Sunrise/Effects/teleport_sparks.rsi
          state: out
          shader: unshaded
      netsync: false
      drawdepth: Effects
    - type: PointLight
      color: "#008DFE"
