- type: entity
  id: TeleportEffectSource
  components:
    - type: Sprite
      layers:
        - sprite: /Textures/_Sunrise/Effects/teleports_effect.rsi
          state: source
          shader: unshaded
      netsync: false
      drawdepth: Effects
    - type: PointLight
      color: "#008DFE"
    # Sunrise added start - одноразовые частицы исходящей телепортации через Trigger.
    - type: TriggerOnSpawn
      keyOut: particle-spawn
    - type: ParticleOnTrigger
      keysIn:
      - particle-spawn
      orchestras:
      - orchestra: TeleportDeparture
        colorSource: SourcePointLight
        fallbackColor: "#008DFEFF"
    # Sunrise added end
    - type: EmitSoundOnSpawn
      sound:
        path: /Audio/_Sunrise/Effects/electrical_short_circuit2.ogg
    - type: TimedDespawn
      lifetime: 0.6
    - type: EvaporationSparkle
    - type: Transform
      noRot: true
      anchored: true

- type: entity
  id: TeleportEffectTarget
  components:
    - type: Sprite
      layers:
        - sprite: /Textures/_Sunrise/Effects/teleports_effect.rsi
          state: target
          shader: unshaded
      netsync: false
      drawdepth: Effects
    - type: PointLight
      color: "#008DFE"
    # Sunrise added start - одноразовые частицы входящей телепортации через Trigger.
    - type: TriggerOnSpawn
      keyOut: particle-spawn
    - type: ParticleOnTrigger
      keysIn:
      - particle-spawn
      orchestras:
      - orchestra: TeleportArrival
        colorSource: SourcePointLight
        fallbackColor: "#008DFEFF"
    # Sunrise added end
    - type: EmitSoundOnSpawn
      sound:
        path: /Audio/_Sunrise/Effects/electrical_short_circuit2.ogg
    - type: TimedDespawn
      lifetime: 0.6
    - type: EvaporationSparkle
    - type: Transform
      noRot: true
      anchored: true
