# Auto-injectors with trigger conditions for use in combat hardsuits

- type: entity
  name: auto-injector-combat-stim-name
  parent: ChemicalMedipen
  id: AutoInjectorCombatStim
  description: auto-injector-combat-stim-desc
  components:
  - type: AutoInjectorTrigger
    totalDamageThreshold: 30.0
    priority: 1
    triggerMessage: auto-injector-emergency-injection
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Epinephrine
          Quantity: 10
        - ReagentId: Bicaridine
          Quantity: 5
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#ff4444"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#ff4444"
      - state: base-colorB-inhand-right

- type: entity
  name: auto-injector-emergency-trauma-name
  parent: ChemicalMedipen
  id: AutoInjectorEmergencyTrauma
  description: auto-injector-emergency-trauma-desc
  components:
  - type: AutoInjectorTrigger
    totalDamageThreshold: 50.0
    damageTypeThresholds:
      Blunt: 25.0
      Slash: 25.0
      Piercing: 25.0
    priority: 2
    triggerMessage: auto-injector-emergency-injection
  - type: SolutionContainerManager
    solutions:
      pen:
        maxVol: 15
        reagents:
        - ReagentId: Bicaridine
          Quantity: 10
        - ReagentId: TranexamicAcid
          Quantity: 5
  - type: Item
    inhandVisuals:
      left:
      - state: base-needle-inhand-left
      - state: base-colorA-inhand-left
        color: "#44ff44"
      - state: base-colorB-inhand-left
      right:
      - state: base-needle-inhand-right
      - state: base-colorA-inhand-right
        color: "#44ff44"
      - state: base-colorB-inhand-right

