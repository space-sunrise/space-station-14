- type: entity
  name: автоинъектор аномалии
  id: AnomalyAutoInjector
  parent: BaseItem
  description: Вводит единоразовую дозу аномального реагента, результат непредсказуем
  components:
    - type: Sprite
      sprite: Objects/Specific/Medical/anomaly_injector.rsi
      layers:
        - state: anomyxine
    - type: Item
      sprite: Objects/Specific/Medical/anomaly_injector.rsi
      size: Tiny
    - type: EmitSoundOnUse
      sound:
        path: /Audio/Items/hypospray.ogg
    - type: AnomalyAutoInjector
    - type: SolutionContainerManager
      solutions:
        pen:
          maxVol: 1
