- type: entity
  name: автоинъектор аномалий
  id: AnomalyAutoInjector
  parent: BaseItem
  description: Вводит небольшую дозу аномального реагента, результат непредсказуем
  components:
    - type: Sprite
      sprite: Objects/Specific/Medical/anomaly_injector.rsi
      layers:
        - state: anomyxine
    - type: Item
      sprite: Objects/Specific/Medical/anomaly_injector.rsi
      size: Tiny
    - type: EmitSoundOnUse
      sound:
        path: /Audio/Items/hypospray.ogg
    - type: AnomalyAutoInjector
      injectionComponents:
        - type: Anomaly
          deleteEntity: false
          maxPointsPerSecond: 100
          corePrototype: AnomalyCoreBluespace
          coreInertPrototype: AnomalyCoreBluespaceInert
        - type: InnerBodyAnomaly
          injectionProto: AnomalyInjectionBluespace
          startMessage: inner-anomaly-start-message-bluespace
          fallbackSprite:
            sprite: Structures/Specific/Anomalies/inner_anom_layer.rsi
            state: bluespace
          speciesSprites:
            Vox:
              sprite: Structures/Specific/Anomalies/inner_anom_layer.rsi
              state: bluespace_VOX
    - type: SolutionContainerManager
      solutions:
        pen:
          maxVol: 1
