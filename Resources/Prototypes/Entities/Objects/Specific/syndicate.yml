
- type: entity
  name: telecrystal
  parent: [BaseItem, BaseSyndicateContraband]
  id: Telecrystal
  suffix: 20 TC
  description: It seems to be pulsing with suspiciously enticing energies.
  components:
  - type: Stack
    count: 20
    stackType: Telecrystal
    #Sunrise-edit-start
    baseLayer: base
    layerStates:
    - telecrystal
    - telecrystal_2
    - telecrystal_3
  - type: Sprite
    sprite: _Sunrise/Objects/Specific/Syndicate/telecrystal.rsi
    state: telecrystal_3
    map: ["base"]
  - type: Item
    sprite: _Sunrise/Objects/Specific/Syndicate/telecrystal.rsi
    size: Tiny
  - type: Appearance
  #Sunrise-edit-end
  - type: StaticPrice
    price: 0
  - type: StackPrice
    price: 200
  - type: Currency
    price:
      Telecrystal: 1

- type: entity
  parent: Telecrystal
  id: Telecrystal1
  suffix: 1 TC
  components:
  - type: Stack
    count: 1
    #Sunrise-start
    stackType: Telecrystal
  - type: Sprite
    state: telecrystal
    layers:
    - state: telecrystal
    #Sunrise-end

- type: entity
  parent: Telecrystal
  id: Telecrystal5
  suffix: 5 TC
  components:
  - type: Stack
    count: 5
    #Sunrise-start
  - type: Sprite
    state: telecrystal
    layers:
    - state: telecrystal
    #Sunrise-end

- type: entity
  parent: Telecrystal
  id: Telecrystal10
  suffix: 10 TC
  components:
  - type: Stack
    count: 10
    #Sunrise-start
    stackType: Telecrystal
  - type: Sprite
    state: telecrystal_2
    #Sunrise-end

# Uplinks
- type: entity
  parent: [BaseItem, StorePresetUplink, BaseSyndicateContraband]
  id: BaseUplinkRadio
  name: syndicate uplink
  description: Suspiciously looking old radio...
  suffix: Empty
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Devices/communication.rsi
    layers:
    - state: old-radio
  - type: Item
    sprite: _Sunrise/Objects/Devices/communication.rsi
    heldPrefix: old-radio
  - type: UserInterface
    interfaces:
      enum.StoreUiKey.Key:
        type: StoreBoundUserInterface
  - type: ActivatableUI
    key: enum.StoreUiKey.Key
  - type: Store
    balance:
      Telecrystal: 0
#Sunrise-start
  - type: Tag
    tags:
    - SyndieAgentUplink
#Sunrise-end

- type: entity
  parent: BaseUplinkRadio
  id: BaseUplinkRadio20TC
  suffix: 20 TC
  components:
  - type: Store
    balance:
      Telecrystal: 20

- type: entity
  parent: BaseUplinkRadio
  id: BaseUplinkRadio25TC
  suffix: 25 TC
  components:
  - type: Store
    balance:
      Telecrystal: 25

#this uplink MUST be used for nukeops, as it has the tag for filtering the listing.
