- type: parallax
  id: Blank

- type: parallax
  id: Default
  layers:
    # Sunrise added start - редкие туманности из масок референса движутся независимо от звёзд.
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/fire_noise.png"
      slowness: 0.9984
      scrolling: "0.018, -0.007"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaMagenta
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/wavy_blotch_noise.png"
      slowness: 0.9971
      scrolling: "-0.012, 0.016"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaCyan
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/dendritic_noise.png"
      slowness: 0.9958
      scrolling: "0.009, 0.021"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaViolet
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/fire_noise.png"
      slowness: 0.9947
      scrolling: "-0.016, -0.011"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaAzure
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/wavy_blotch_noise.png"
      slowness: 0.9935
      scrolling: "0.014, 0.013"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaRose
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/dendritic_noise.png"
      slowness: 0.9922
      scrolling: "-0.008, 0.019"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaTeal
    # Sunrise added end
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "hq_wizard_stars"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars.toml"
      slowness: 0.996625
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "hq_wizard_stars_dim"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars_dim.toml"
      slowness: 0.989375
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "hq_wizard_stars_faster"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars-2.toml"
      slowness: 0.987265625
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "hq_wizard_stars_dim_faster"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars_dim-2.toml"
      slowness: 0.984352
  layersLQ:
    # Sunrise added start - сохраняем независимые туманности при упрощённом параллаксе.
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/fire_noise.png"
      slowness: 0.9984
      scrolling: "0.018, -0.007"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaMagenta
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/wavy_blotch_noise.png"
      slowness: 0.9971
      scrolling: "-0.012, 0.016"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaCyan
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/dendritic_noise.png"
      slowness: 0.9958
      scrolling: "0.009, 0.021"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaViolet
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/fire_noise.png"
      slowness: 0.9947
      scrolling: "-0.016, -0.011"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaAzure
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/wavy_blotch_noise.png"
      slowness: 0.9935
      scrolling: "0.014, 0.013"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaRose
    - texture:
        !type:ImageParallaxTextureSource
        path: "/Textures/_Sunrise/Parallaxes/Nebula/dendritic_noise.png"
      slowness: 0.9922
      scrolling: "-0.008, 0.019"
      scale: "3.75, 2.109375"
      shader: SunriseParallaxNebulaTeal
    # Sunrise added end
    # Sunrise added start - сохраняем разделение микрозвёзд и цветных звёзд в LQ.
    - texture:
        !type:GeneratedParallaxTextureSource
        id: "lq_wizard_stars_dim"
        configPath: "/Prototypes/Parallaxes/parallax_config_stars_dim.toml"
      slowness: 0.95
    # Sunrise added end
    - texture:
        !type:GeneratedParallaxTextureSource
        id: ""
        configPath: "/Prototypes/Parallaxes/parallax_config.toml"
      slowness: 0.875
  layersLQUseHQ: false

