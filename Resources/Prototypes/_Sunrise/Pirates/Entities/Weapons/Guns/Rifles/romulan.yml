- type: entity
  id: SunriseWeaponRifleRomulan
  parent: [BaseWeaponRifle, BaseMajorContraband]
  name: Romulan
  description: Yarrr, a retrofitted lecter befitting of a pirate! Make lotta dakka dakka. Uses .20 rifle ammo.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Rifles/romulan.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Rifles/romulan.rsi
  - type: Gun
    minAngle: 3.3
    maxAngle: 66
    angleIncrease: 3.3
    fireRate: 6.6
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: MagazineRifleSP # TODO: Заменить на MagazineRifleImprovised после добавления прототипа.
        insertSound: /Audio/Weapons/Guns/MagIn/ltrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/ltrifle_magout.ogg
        priority: 2
        whitelist:
          tags:
          - MagazineRifle
        whitelistFailPopup: gun-magazine-whitelist-fail
      gun_chamber:
        name: Chamber
        startingItem: CartridgeRifleSP
        priority: 1
        whitelist:
          tags:
          - CartridgeRifle
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
      gun_chamber: !type:ContainerSlot
  - type: MagazineVisuals
    magState: mag
    steps: 3
    zeroVisible: true
  - type: Appearance
  - type: CanDualWield
    dualWieldInaccuracyPenalty: 1
    dualWieldFireRatePenalty: 0.06
    dualWieldRecoilPenalty: 0.6
