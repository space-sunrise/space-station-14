- type: entity
  parent:
  - WeaponRevolverPirate
  - PowerCellSlotSmallItem
  id: SunriseWeaponRevolverPirateJammer
  name: pirate jammer revolver
  description: A battered revolver with an improvised radio jammer built into the grip. It blocks nearby radio traffic while active, but leaves the Freelance channel untouched.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Weapons/Guns/Revolvers/pirate_revolver.rsi
    layers:
    - state: icon
    - state: jammer_high_charge
      map: ["enum.PowerDeviceVisualLayers.Powered"]
      shader: unshaded
      visible: false
  - type: Clothing
    sprite: _Sunrise/Objects/Weapons/Guns/Revolvers/pirate_revolver.rsi
  - type: RadioJammer
    frequenciesExcluded:
    - 1984
    settings:
    - wattage: 5
      range: 6
      message: radio-jammer-component-set-message-low
      name: radio-jammer-component-setting-low
    - wattage: 15
      range: 12
      message: radio-jammer-component-set-message-high
      name: radio-jammer-component-setting-high
  - type: ItemToggle
    onUse: false
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.BatteryVisuals.State:
        enum.PowerDeviceVisualLayers.Powered:
          Full: { state: jammer_high_charge }
          Neither: { state: jammer_medium_charge }
          Empty: { state: jammer_low_charge }
      enum.ToggleableVisuals.Enabled:
        enum.PowerDeviceVisualLayers.Powered:
          True: { visible: true }
          False: { visible: false }
  - type: ToggleCellDraw
  - type: BatteryVisuals
  - type: ItemSlots
    slots:
      cell_slot:
        name: power-cell-slot-component-slot-name-default
        startingItem: PowerCellSmallNuclear
        disableEject: true
        whitelist:
          tags:
          - PowerCell
        swap: false
