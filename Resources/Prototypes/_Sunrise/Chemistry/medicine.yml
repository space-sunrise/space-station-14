- type: reagent
  id: HemostaticPowder
  name: reagent-name-hemostatic-powder
  group: Medicine
  desc: reagent-desc-hemostatic-powder
  physicalDesc: reagent-physical-desc-grainy
  flavor: medicine
  color: "#8b0b47"
  metabolisms:
    Medicine:
      effects:
      - !type:ModifyBleed
        amount: -3
      - !type:HealthChange
        damage:
          groups:
            Brute: -2
      - !type:HealthChange
        damage:
          types:
            Mangleness: 0.2 #Sunrise-Edit
      - !type:HealthChange
        conditions:
        - !type:ReagentCondition
          reagent: HemostaticPowder
          min: 10.1
        damage:
          types:
            Poison: 3

