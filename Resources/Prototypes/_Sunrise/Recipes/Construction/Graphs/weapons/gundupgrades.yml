- type: constructionGraph
  id: UpgradeArmorVest
  start: start
  graph:
    # стартовый узел — проверка наличия базового бронежилета
    - node: start
      edges:
        # Ветка "против пуль"
        - to: plate
          steps:

            - tag: UpgradeKitPlate
              doAfter: 6
        # Ветка "против ударов"
        - to: stab
          steps:

            - tag: UpgradeKitStab
              doAfter: 6
        # Ветка "против лазеров"
        - to: heat
          steps:

            - tag: UpgradeKitHeat
              doAfter: 6

    # Ветка "против пуль"
    - node: plate
      entity: ClothingOuterArmorPlate
      edges:
        - to: bullet
          steps:
            - tag: UpgradeKitBullet
              doAfter: 10

    - node: bullet
      entity: ClothingOuterArmorBulletproof
      edges:
        - to: bullet_heavy
          steps:
            - tag: UpgradeKitBulletHeavy
              doAfter: 12

    - node: bullet_heavy
      entity: ClothingOuterArmorBulletproofHeavy

    # Ветка "против ударов"
    - node: stab
      entity: ClothingOuterArmorStab
      edges:
        - to: riot
          steps:
            - tag: UpgradeKitRiot
              doAfter: 12

    - node: riot
      entity: ClothingOuterArmorRiot

    # Ветка "против лазеров"
    - node: heat
      entity: ClothingOuterArmorHeatAbsorb
      edges:
        - to: reflective
          steps:
            - tag: UpgradeKitReflective
              doAfter: 12

    - node: reflective
      entity: ClothingOuterArmorReflective

# Gorilla Gauntlet
- type: constructionGraph
  id: UpgradeCyberGorilla
  start: start
  graph:
    - node: start
      entity: WeaponGauntletGorilla
      edges:
        - to: upgraded
          steps:
            - tag: GorillaUpgradeKit
              name: construction-graph-tag-gorilla-upgrade-kit
              doAfter: 2
    - node: upgraded
      entity: CyberGorillaArm

# Gorilla
- type: constructionGraph
  id: UpgradeCyberArmGorilla
  start: start
  graph:
    - node: start
      edges:
        - to: base_left
          steps: []
    - node: base_left
      entity: LeftArmCyberGorilla
      edges:
        - to: base_right
          steps:
            - tool: Screwing
              doAfter: 1
        - to: upgraded_left
          steps:
            - tag: WeaponPistolCHIMPUpgradeKit
              name: construction-graph-tag-weapon-pistol-chimp-upgrade-kit
            - tag: GorillaUpgradeKit
              name: construction-graph-tag-gorilla-upgrade-kit
              doAfter: 2
    - node: base_right
      entity: RightArmCyberGorilla
      edges:
        - to: base_left
          steps:
            - tool: Screwing
              doAfter: 1
        - to: upgraded_right
          steps:
            - tag: WeaponPistolCHIMPUpgradeKit
              name: construction-graph-tag-weapon-pistol-chimp-upgrade-kit
            - tag: GorillaUpgradeKit
              name: construction-graph-tag-gorilla-upgrade-kit
              doAfter: 2
    - node: upgraded_left
      entity: LeftArmCyberGorillaUpgraded
      edges:
        - to: upgraded_right
          steps:
            - tool: Screwing
              doAfter: 1
        - to: base_left
          steps:
            - tool: Prying
              doAfter: 2
    - node: upgraded_right
      entity: RightArmCyberGorillaUpgraded
      edges:
        - to: upgraded_left
          steps:
            - tool: Screwing
              doAfter: 1
        - to: base_right
          steps:
            - tool: Prying
              doAfter: 2
