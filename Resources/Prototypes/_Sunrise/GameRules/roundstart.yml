- type: entity
  id: DiseaseRule
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: DiseaseRule

- type: entity
  id: Fugitive
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: StationEvent
    weight: 15
    earliestStart: 10
    minimumPlayers: 10
    reoccurrenceDelay: 20
    duration: null
  - type: LateJoinSpawnRule
    prototype: SpawnPointGhostFugitive
  - type: FugitiveRule
  - type: DynamicRuleCost
    cost: 65

- type: entity
  id: PlanetPrison
  parent: BaseGameRule
  categories: [ HideSpawnMenu ]
  components:
  - type: PlanetPrisonRule

- type: entity
  parent: BaseGameRule
  id: Vampire
  components:
  - type: GameRule
    delay:
      min: 600
      max: 900
  - type: VampireRule
  - type: AntagSelection
    agentName: vampire-roundend-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 13
      playerRatio: 10
      lateJoinAdditional: true
      allowNonHumans: True
      multiAntagSetting: None
      mindRoles:
      - MindRoleVampire
  - type: DynamicRuleCost
    cost: 125

- type: entity
  parent: BaseGameRule
  id: GreenShitStationEventScheduler
  components:
  - type: BasicStationEventScheduler
    scheduledGameRules: !type:NestedSelector
      tableId: BasicCalmGameRulesTable

- type: entityTable
  id: BasicCalmGameRulesTable
  table: !type:AllSelector # we need to pass a list of rules, since rules have further restrictions to consider via StationEventComp
    children:
      - !type:NestedSelector
        tableId: BasicCalmEventsTableGreenShit #BasicCalmEventsTable Когда нибудь вернуть
      - !type:NestedSelector
        tableId: CargoGiftsTable
      - !type:NestedSelector
        tableId: CalmPestEventsTable
