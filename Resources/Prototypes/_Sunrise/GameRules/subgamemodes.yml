#Subgamemode variant of vamps. There's less of them.
- type: entity
  parent: Vampire
  id: VampireLess
  components:
  - type: GameRule
    delay:
      min: 600
      max: 900
  - type: VampireRule
  - type: AntagSelection
    agentName: vampire-roundend-name
    definitions:
    - prefRoles: [ Vampire ]
      max: 6
      playerRatio: 20
      lateJoinAdditional: true
      allowNonHumans: True
      multiAntagSetting: None
      mindRoles:
      - MindRoleVampire

#Subgamemode variant of traitor. There's less of them.
- type: entity
  parent: Traitor
  id: TraitorLess
  components:
  - type: GameRule
    delay:
      min: 600
      max: 900
  - type: AntagSelection
    selectionTime: IntraPlayerSpawn
    definitions:
    - prefRoles: [ Traitor ]
      max: 6
      playerRatio: 20
      blacklist:
        components:
        - AntagImmune
      lateJoinAdditional: false
      mindRoles:
      - MindRoleTraitor

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoVampire
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: SubWizard
      prob: 0.05
    - id: Xenoborgs
      prob: 0.05

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoVampireNoWizard
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
    - id: Xenoborgs
      prob: 0.05

- type: entity
  parent: BaseGameRule
  id: SubGamemodesRuleNoVampireNoWizardNoXenoborgs
  components:
  - type: SubGamemodes
    rules:
    - id: Thief
      prob: 0.5
