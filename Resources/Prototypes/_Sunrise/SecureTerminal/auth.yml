- type: entity
  parent: BaseStructureComputer
  id: SunriseKeycardAuth
  name: keycard authentication device
  description: A wall-mounted device for authorizing protected command requests.
  components:
  - type: WallMount
  - type: Physics
    canCollide: false
  - type: Sprite
    drawdepth: SmallObjects
    sprite: _Sunrise/Structures/Machines/auth.rsi
    offset: "0.0,-0.2"
    layers:
    - state: base
    - state: light
      shader: unshaded
      visible: false
      map: ["light"]
  - type: Rotatable
    rotateWhileAnchored: false
  - type: Transform
    anchored: true
  - type: Anchorable
    flags:
    - Anchorable
  - type: ApcPowerReceiver
    powerLoad: 100
  - type: Godmode
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: ExtensionCableReceiver
  - type: ActivatableUIRequiresPower
  - type: ActivatableUI
    key: enum.SecureCommandTerminalUiKey.Key
  - type: UserInterface
    interfaces:
      enum.SecureCommandTerminalUiKey.Key:
        type: SecureCommandTerminalBui
  - type: SecureCommandTerminalConsole
    authTerminal: true
  - type: Appearance
  - type: ToggleableVisuals
    spriteLayer: light
  - type: ContainerContainer
    containers:
      book_slot: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      book_slot:
        startingItem: SunriseBookSecureTerminalManual
        ejectOnInteract: false
        insertOnInteract: true
        whitelist:
          tags:
          - Book
