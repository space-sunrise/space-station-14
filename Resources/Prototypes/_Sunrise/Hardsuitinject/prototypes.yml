- type: Tag
  id: FitsHardsuit

- type: entity
  parent: BaseBeaker
  name: Ampula
  id: Ampula
  components:
  - type: Sprite
    scale: 0.75,0.75
    sprite: _Sunrise/HardsuitInjection/ampula.rsi
    layers:
      - state: beaker
      - state: beaker1
        map: ["enum.SolutionContainerLayers.Fill"]
        visible: false
  - type: Item
    sprite: _Sunrise/HardsuitInjection/ampula.rsi
    size: Small
  - type: SolutionContainerManager
    solutions:
      beaker:
        maxVol: 20
  - type: Ampula
  - type: Tag
    tags:
    - FitsHardsuit

