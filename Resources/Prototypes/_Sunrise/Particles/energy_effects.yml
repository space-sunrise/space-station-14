# Тесла и энергетические снаряды

- type: particleEffect
  id: TeslaOrbitMotes
  priority: Ambient
  sprite:
    sprite: _Sunrise/Particles/enhanced.rsi
    state: glow_mote
  shader: unshaded
  startColor: "#E9FFFFFF"
  endColor: "#43C7FF00"
  sizeOverLifetime:
  - time: 0
    value: 0.55
  - time: 0.3
    value: 1
  - time: 1
    value: 0.08
  particleSize: 0.2
  sizeVariance: 0.45
  lifetime: 0.72
  lifetimeVariance: 0.22
  speed: 0.22
  speedVariance: 0.15
  drag: 0.3
  noiseStrength: 0.18
  noiseFrequency: 2.4
  emissionRate: 20
  maxCount: 18
  spreadAngle: 360
  worldSpace: true
  shape:
    type: CircleEdge
    radius: 0.68

