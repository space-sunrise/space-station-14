# Shared material primitives

- type: particleEffect
  id: BaseMaterialSpark
  abstract: true
  priority: Interaction
  sprite:
    sprite: _Sunrise/Particles/enhanced.rsi
    state: spark
  shader: unshaded
  particleSize: 0.26
  sizeVariance: 0.3
  sizeOverLifetime:
  - time: 0
    value: 1
  - time: 0.55
    value: 0.72
  - time: 1
    value: 0.08
  stretchFactor: 0.16
  lifetime: 0.4
  lifetimeVariance: 0.12
  speed: 2.8
  speedVariance: 0.9
  gravity: 1.5
  drag: 0.5
  emissionRate: 0
  maxCount: 8
  burst: true
  spreadAngle: 80
  alignToVelocity: true
  worldSpace: true
  shape:
    type: CircleFill
    radius: 0.035

