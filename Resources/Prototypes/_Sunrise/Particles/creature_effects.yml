# Короткие реакции на урон подчёркивают необычную природу существ, не перекрывая их спрайты.

- type: particleEffect
  id: BaseCreatureImpactMotes
  abstract: true
  priority: Interaction
  sprite:
    sprite: _Sunrise/Particles/generic.rsi
    state: cross
  shader: unshaded
  alphaOverLifetime:
  - time: 0
    value: 1
  - time: 0.72
    value: 0.82
  - time: 1
    value: 0
  sizeOverLifetime:
  - time: 0
    value: 0.72
  - time: 0.2
    value: 1
  - time: 1
    value: 0.08
  particleSize: 0.9
  sizeVariance: 0.24
  lifetime: 0.62
  lifetimeVariance: 0.14
  speed: 0.88
  speedVariance: 0.32
  drag: 0.7
  emissionRate: 0
  maxCount: 8
  burst: true
  spreadAngle: 24
  directionMode: RadialOutward
  startRotationVariance: 180
  rotationSpeedVariance: 90
  worldSpace: false
  shape:
    type: CircleFill
    radius: 0.1

