# Одноразовые всплески показывают успешный каст у мага, сохраняя отдельную визуальную семантику заклинаний.

- type: particleEffect
  id: BaseMagicCastMotes
  abstract: true
  priority: Interaction
  sprite:
    sprite: _Sunrise/Particles/generic.rsi
    state: cross
  shader: unshaded
  alphaOverLifetime:
  - time: 0
    value: 0
  - time: 0.08
    value: 1
  - time: 0.75
    value: 0.88
  - time: 1
    value: 0
  sizeOverLifetime:
  - time: 0
    value: 0.45
  - time: 0.2
    value: 1
  - time: 1
    value: 0.08
  particleSize: 0.92
  sizeVariance: 0.24
  lifetime: 0.72
  lifetimeVariance: 0.14
  speed: 0.82
  speedVariance: 0.26
  drag: 0.58
  emissionRate: 0
  maxCount: 12
  burst: true
  spreadAngle: 22
  directionMode: RadialOutward
  startRotationVariance: 180
  rotationSpeedVariance: 80
  worldSpace: true
  shape:
    type: CircleEdge
    radius: 0.2

