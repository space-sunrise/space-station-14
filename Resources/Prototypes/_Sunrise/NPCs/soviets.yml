# Base
- type: entity
  abstract: true
  parent:
  - MobNonHumanHostileBase
  - MobHumanoidInvetorySimplified
  - MobPassiveRegen
  name: comrade
  id: MobSovietBase
  categories: [ Spawner ]
  components:
  # Allows ghosts/admins to quickly warp to soviets from the ghost teleport panel
  # - type: GhostPanelAntagonistMarker
  #   name: ghost-panel-antagonist-soviet-name
  #   description: ghost-panel-antagonist-soviet-description
  #   priority: 45
  - type: Damageable
    damageModifierSet: MobPirateT1
  - type: NpcFactionMember
    factions:
    - Soviet
  - type: FootprintEmitter
  - type: MobThresholds
    thresholds:
      0: Alive
      120: Critical
      125: Dead
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageGroupTrigger
        damageGroup: Brute
        damage: 300
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          OrganLootSpawner:
            min: 1
            max: 1
      - !type:GibBehavior { }
    - trigger:
        !type:DamageTypeTrigger
        damageType: Heat
        damage: 600
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawnInContainer: true
        spawn:
          Ash:
            min: 1
            max: 1
      - !type:BurnBodyBehavior { }
      - !type:PlaySoundBehavior
        sound:
          collection: MeatLaserImpact
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 15
      behaviors:
      - !type:PopupBehavior
        popup: mouth-taste-metal
        popupType: LargeCaution
        targetOnly: true
    - trigger:
        !type:DamageTypeTrigger
        damageType: Radiation
        damage: 75
      behaviors:
      - !type:VomitBehavior
  - type: PassiveDamage
    allowedStates:
    - Alive
    - Critical
    damageCap: 125
  - type: Stamina
    baseCritThreshold: 150
  - type: DamageStateVisuals
  - type: RotationVisuals
    defaultRotation: 90
    horizontalRotation: 90
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatHuman
      amount: 5
  - type: RechargeBasicEntityAmmo
    rechargeCooldown: 2
    rechargeSound:
      path: /Audio/_Sunrise/Effects/silence.ogg
  - type: Strippable
  - type: Tool
    speedModifier: 10
    qualities:
    - Prying
  - type: Prying
    pryPowered: true
    force: true
    speedModifier: 10
    useSound:
      path: /Audio/Items/crowbar.ogg
  - type: UserInterface
    interfaces:
      enum.StrippingUiKey.Key:
       type: StrippableBoundUserInterface
  - type: ToggleableNightVision
    effect: EffectNightVisionPirate
  - type: ComplexInteraction
  - type: TTS
    voice: necrophos_dota_2
  # - type: GhostRole
  #   prob: 0.1
  #   makeSentient: true
  #   name: ghost-role-information-expedition-soviet-name
  #   description: ghost-role-information-expedition-soviet-description
  #   rules: ghost-role-information-expedition-soviet-rules
  #   raffle:
  #     settings: short
  # - type: GhostTakeoverAvailable
  - type: GhostOnMove
    mustBeDead: true
  - type: Puller
    needsHands: false

# For Expedition NPC
- type: entity
  abstract: true
  id: MobSovietTimedDespawn
  components:
  - type: TimedDespawn
    lifetime: 1200 # 20 minutes


