- type: entity
  id: Jump
  categories: [ HideSpawnMenu ]
  name: jump-action-name
  description: jump-action-description
  components:
  - type: Action
    useDelay: 20
    icon:
      sprite: _Sunrise/Actions/zombie.rsi
      state: jump
    itemIconStyle: NoItem
  - type: TargetAction
    range: 200
    checkCanAccess: false
  - type: WorldTargetAction
    event: !type:JumpActionEvent

- type: entity
  parent: Jump
  id: JumpMoth
  categories: [ HideSpawnMenu ]
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon:
      sprite: _Starlight/Actions/resomi.rsi
      state: jump
  - type: LimitedCharges
    maxCharges: 3
  - type: AutoRecharge
    rechargeDuration: 30
  - type: WorldTargetAction
    event: !type:JumpActionEvent
      distance: 2.25   # about 3 tiles after momentum / friction factors in
      toPointer: false # moths only get control over direction, not distance
      speed: 4.5       # equal to movement speed
      sound:
        path: /Audio/_Starlight/Effects/Jump/moth.ogg
