- type: entity
  parent: BaseMentalAction
  id: ActionStationAiBodyMenu
  name: Manage AI bodies
  description: Open the list of available AI bodies.
  components:
  - type: Action
    raiseOnUser: true
    priority: -4
    itemIconStyle: NoItem
    icon:
      sprite: _Sunrise/Interface/Actions/actions_borg.rsi
      state: ai_connection
    useDelay: 0.5
  - type: InstantAction
    event: !type:StationAiBodyOpenUiActionEvent

- type: entity
  parent: BaseAction
  id: ActionStationAiBodyExit
  name: Leave AI body
  description: Return your mind to the AI core.
  components:
  - type: Action
    priority: -4
    itemIconStyle: NoItem
    icon:
      sprite: Interface/Actions/actions_ai.rsi
      state: ai_core
    useDelay: 0.5
  - type: InstantAction
    event: !type:StationAiBodyExitActionEvent
