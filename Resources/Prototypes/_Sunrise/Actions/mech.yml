- type: entity
  id: ActionMechSiren
  name: Siren
  description: Toggles mech siren.
  components:
  - type: Action
    useDelay: 1
    itemIconStyle: NoItem
    icon: { sprite: Clothing/OuterClothing/Hardsuits/paramed.rsi, state: icon }
    iconOn: { sprite: Clothing/OuterClothing/Hardsuits/paramed.rsi, state: icon-siren }
  - type: InstantAction
    event: !type:MechToggleSirenEvent
