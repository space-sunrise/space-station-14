- type: entity
  id: SunriseEnergyDomeGrenadeSyndie
  parent: [ ImpactGrenadeBase, BaseSyndicateContraband ]
  name: shield deployment grenade
  description: An impact grenade that deploys a temporary Syndicate energy shield generator.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Tools/EnergyDome/syndie_back.rsi
    layers:
      - state: icon
  - type: Item
    size: Normal
  - type: SpawnOnTrigger
    keysIn:
    - trigger
    proto: SunriseEnergyDomeGeneratorBackpackSyndieTimed
    useMapCoords: true
  - type: DeleteOnTrigger
    keysIn:
    - trigger

- type: entity
  id: SunriseEnergyDomeGrenadeERT
  parent: [ ImpactGrenadeBase, BaseCentcommContraband ]
  name: ERT shield grenade
  description: An impact grenade that deploys a temporary Nanotrasen energy shield generator.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Tools/EnergyDome/nanotrasen_back.rsi
    layers:
      - state: icon
  - type: Item
    size: Normal
  - type: SpawnOnTrigger
    keysIn:
    - trigger
    proto: SunriseEnergyDomeGeneratorBackpackNTTimed
    useMapCoords: true
  - type: DeleteOnTrigger
    keysIn:
    - trigger
