- type: entity
  name: switchblade
  parent: [CombatKnife, BaseMinorContraband]
  id: WeaponMeleeSwitchblade
  description: SCHINK! So cool.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/switchblade.rsi
    layers:
    - state: switchblade
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
    sprite: _Starlight/Objects/Weapons/Melee/switchblade.rsi
    storedSprite:
  - type: ItemToggle
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 15
  - type: MeleeWeapon
    wideAnimationRotation: -135
    attackRate: 2.2
    damage:
      types:
        Blunt: 2
        Structural: 4
  - type: ComponentToggler
    components:
    - type: DamageOtherOnHit
      damage:
        types:
          Slash: 20
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/star_hit.ogg
      offset: -0.15,0.0
    - type: BackstabOnHit
      bonusDamage:
        types:
          Slash: 30
      popupMessages:
        - backstab-popup-message-1
        - backstab-popup-message-2
        - backstab-popup-message-3
      popupWeights:
        - 0.9
        - 0.075
        - 0.025
  - type: ItemToggleSize
    activatedSize: Small
    activatedShape:
    - 0,0,0,1
    deactivatedSize: Tiny
    deactivatedShape:
    - 0,0,0,0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: icon }
          False: { state: switchblade }
  # Prevents spamming use to reset the swing delay.
  # Also provides the teleporter cooldown via the TeleportDelay entry.
  - type: UseDelay
    delays:
      TeleportDelay:
        length: 10 # seconds
  - type: SyndicateTeleporter
    randomDistanceValue: 4
    teleportationValue: 4
    damageOnBlocked:
      types:
        Cellular: 10
  - type: DisableMeleeWideAttack
  - type: LimitedCharges
    maxCharges: 2
  - type: ThrowingAngle
    angle: 180
