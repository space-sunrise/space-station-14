- type: entity
  name: switchblade
  parent: [CombatKnife, BaseMinorContraband]
  id: WeaponMeleeSwitchblade
  description: SCHINK! So cool.
  components:
  - type: Sprite
    sprite: _Starlight/Objects/Weapons/Melee/switchblade.rsi
    layers:
    - state: switchblade
      map: [ "enum.ToggleableVisuals.Layer" ]
  - type: Item
    size: Tiny
    shape:
    - 0,0,0,0
    sprite: _Starlight/Objects/Weapons/Melee/switchblade.rsi
    storedSprite:
  - type: ItemToggle
  - type: ItemToggleMeleeWeapon
    activatedDamage:
      types:
        Slash: 10
  - type: MeleeWeapon
    autoAttack: true
    wideAnimationRotation: -135
    attackRate: 2
    damage:
      types:
        Blunt: 2
        Structural: 4
  - type: ComponentToggler
    components:
    - type: DamageOtherOnHit
      damage:
        types:
          Slash: 12
    - type: EmbeddableProjectile
      sound: /Audio/Weapons/star_hit.ogg
      offset: -0.15,0.0
    - type: BackstabOnHit
      bonusDamage:
        types:
          Slash: 12
      popupMessages: SunriseBackstabPopupMessages
  - type: ItemToggleSize
    activatedSize: Small
    activatedShape:
    - 0,0,0,1
    deactivatedSize: Tiny
    deactivatedShape:
    - 0,0,0,0
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        enum.ToggleableVisuals.Layer:
          True: { state: icon }
          False: { state: switchblade }
  - type: MeleeBlink
    randomDistanceValue: 0
    teleportationValue: 5
    landingRandomOffset: 0
    damageOnBlocked:
      types:
        Cellular: 1
  - type: MeleeBlinkKnockdown
    knockdownDuration: 2
  - type: UseSecondaryMeleeAltInteract
  - type: AutoRecharge
    rechargeDuration: 15
  - type: LimitedCharges
    maxCharges: 2
  - type: ThrowingAngle
    angle: 180
- type: weightedRandom
  id: SunriseBackstabPopupMessages
  weights:
    backstab-popup-message-1: 0.9
    backstab-popup-message-2: 0.075
    backstab-popup-message-3: 0.025
