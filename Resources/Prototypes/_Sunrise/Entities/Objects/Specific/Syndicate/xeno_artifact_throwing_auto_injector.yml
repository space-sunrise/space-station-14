- type: entity
  id: XenoArtifactThrowingAutoInjector
  parent: [BaseItem, BaseSyndicateContraband]
  name: метательный автоинъектор артефакта
  description: Активируется при броске, вонзаясь в живое существо и единоразово вводя частицы артефакта.
  components:
    - type: Sprite
      sprite: _Sunrise/Objects/Specific/Syndicate/xeno_artifact_throwing_auto_injector.rsi
      layers:
        - state: closed
          map: ["enum.XenoArtifactThrowingAutoInjectorVisualLayers.Base"]
    - type: XenoArtifactThrowingAutoInjector
    - type: EmbeddableProjectile
      embedOnThrow: true
      minimumSpeed: 2
      removalTime: 1
      deleteOnRemove: false
    - type: Item
      size: Tiny
