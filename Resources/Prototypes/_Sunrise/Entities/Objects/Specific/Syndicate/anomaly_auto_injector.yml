- type: entity
  name: автоинъектор аномалии
  id: BaseAnomalyAutoInjector
  abstract: true
  parent: [BaseItem, BaseSyndicateContraband]
  description: Вводит случайную аномалию в гуманоида. Одноразовый.
  components:
    - type: Sprite
      sprite: _Sunrise/Objects/Specific/Syndicate/anomaly_auto_injector.rsi
      layers:
        - state: anomagen
          map: ["base"]
    - type: AnomalyAutoInjector
      anomalyTrapProtos:
        # все существующие аномалии на данный момент
        - AnomalyTrapFlora
        - AnomalyTrapFlesh
        - AnomalyTrapTech
        - AnomalyTrapRock
        - AnomalyTrapBluespace
        - AnomalyTrapPyroclastic
        - AnomalyTrapElectricity
        - AnomalyTrapIce
        - AnomalyTrapShadow
        - AnomalyTrapGravity
        - AnomalyTrapSanta

- type: entity
  id: AnomalyAutoInjector
  parent: BaseAnomalyAutoInjector
  description: Вводит в гуманоида одну из базовых аномалий.
  components:
    - type: AnomalyAutoInjector
      anomalyTrapProtos:
      # без имбовых (Pyroclastic,Electricity,Ice,Shadow,Santa) + (Gravity) - грузит сервак и бесполезен для зека
        - AnomalyTrapFlora
        - AnomalyTrapFlesh
        - AnomalyTrapTech
        - AnomalyTrapRock
        - AnomalyTrapBluespace

- type: entity
  id: AnomalyAutoInjectorUplink
  parent: BaseAnomalyAutoInjector
  description: Вводит в гуманоида случайную аномалию из всего спектра существующих.
  components:
    - type: AnomalyAutoInjector
      anomalyTrapProtos:
      # все аномалии (кроме Santa)
        - AnomalyTrapFlora
        - AnomalyTrapFlesh
        - AnomalyTrapTech
        - AnomalyTrapRock
        - AnomalyTrapBluespace
        - AnomalyTrapPyroclastic
        - AnomalyTrapElectricity
        - AnomalyTrapIce
        - AnomalyTrapShadow
        - AnomalyTrapGravity




