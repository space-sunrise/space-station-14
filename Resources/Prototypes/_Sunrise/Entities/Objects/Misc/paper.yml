- type: entity
  parent: Paper
  id: StationGoalPaper
  name: station goal centcomm message
  description: 'It looks like you have a lot of work to do.'
  components:
    - type: Paper
      stampState: paper_stamp-centcom
      stampedBy:
      - stampedName: stamp-component-stamped-name-centcom
        stampedColor: "#bb3232"

- type: entity
  name: office paper
  parent: Paper
  id: HolographicPaper
  description: 'A plain sheet of office paper.'
  components:
  - type: PaperVisuals
    backgroundImagePath: "/Textures/_Sunrise/Interface/Paper/paper_background_holographic.svg.96pdi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 16.0, 16.0, 16.0, 16.0
    fontAccentColor: "#ffffff"
  - type: Paper
    defaultColor: "#07edf5"
  - type: Sprite
    sprite: /Textures/Objects/Misc/bureaucracy.rsi
    layers:
    - state: holo_paper
    - state: holo_paper_written
      map: ["enum.PaperVisualLayers.Writing"]
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Sunrise/Items/Handling/multitool_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/multitool_drop.ogg
  - type: EmitSoundOnUse
    sound:
      path: /Audio/_Sunrise/Abductor/holopaper_open.ogg
  - type: EmitSoundOnCollide
    sound:
      collection: WeakHit
  - type: EmitSoundOnThrow
    sound:
      collection: WeakHit

# MedTak invoice form
- type: entity
  name: MedTak invoice
  parent: Paper
  id: PaperMedTak
  description: A piece of paper headed by the MedTak logo. It looks expensive. For you.
  components:
  - type: Sprite
    layers:
    - state: paper
      color: "#ffffff"
    - state: paper_words
      map: ["enum.PaperVisualLayers.Writing"]
      color: "#ffffff"
      visible: false
    - state: paper_stamp-generic
      map: ["enum.PaperVisualLayers.Stamp"]
      visible: false
  - type: PaperLabelType
    paperType: CaptainsPaper
  - type: PaperVisuals
    headerImagePath: "/Textures/_Sunrise/Interface/Paper/MedTak.png"
    backgroundImagePath: "/Textures/Interface/Paper/paper_background_default.svg.96dpi.png"
    backgroundPatchMargin: 16.0, 16.0, 16.0, 16.0
    contentMargin: 8.0, 16.0, 8.0, 0.0
    maxWritableArea: 350.0, 0.0
