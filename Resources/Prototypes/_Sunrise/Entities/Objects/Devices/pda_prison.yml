### Пилот пока не используется в ротации ###
- type: entity
  parent: BasePDA
  id: PrisonPilotPDA
  name: prison pilot's PDA
  description: Shiny and technologically advanced, as if it had just been pulled out of the cockpit.
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Devices/pda.rsi
  - type: Icon
    sprite: _Sunrise/Objects/Devices/pda.rsi
  - type: Pda
    id: PrisonPilotIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-space-prison-pilot
  - type: PdaBorderColor
    borderColor: "#cc7014"
    accentVColor: "#cc3d3d"
    accentHColor: "#3d3d40"
    state: pda-space-prison-pilot
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge
      - AstroNavCartridge


### Prison - Start ###

- type: entity
  parent: BasePDA
  id: SecurityMetusPDA
  abstract: true
  components:
  - type: Sprite
    sprite: _Sunrise/Objects/Devices/pda.rsi
    layers:
    - map: [ "enum.PdaVisualLayers.Base" ]
      state: "pda"
    - state: "light_overlay"
      map: [ "enum.PdaVisualLayers.Flashlight" ]
      shader: "unshaded"
      visible: false
    - state: "id_inserted-space-prison"
      map: [ "enum.PdaVisualLayers.IdLight" ]
      shader: "unshaded"
      visible: false
  - type: Icon
    sprite: _Sunrise/Objects/Devices/pda.rsi
  - type: CartridgeLoader
    uiKey: enum.PdaUiKey.Key
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - NanoTaskCartridge
      - NewsReaderCartridge

