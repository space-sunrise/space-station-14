- type: entity
  id: BaseCentCommShuttles
  abstract: true
  components:
  - type: SpawnGridAndDockToStation
    grids:
    - gridPath: /Maps/_Sunrise/Shuttles/centcom_shuttle.yml
      priorityTag: DockCentComm

- type: entity
  id: BaseStationCentComm
  abstract: true
  components:
  - type: StationCentComm
    station: SunriseCentComm
    shuttleWhitelist:
      components:
      - CentCommShuttle
      - ErtShuttle

- type: entity
