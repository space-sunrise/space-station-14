- type: entity
  parent: BaseSpeciesAppearance
  id: AppearanceDemon
  name: demon appearance
  components:
  - type: InitialBody
    organs:
      Torso: TorsoDemon
      Head: HeadDemon
      ArmLeft: LeftArmDemon
      ArmRight: RightArmDemon
      HandRight: RightHandDemon
      HandLeft: LeftHandDemon
      LegLeft: LeftLegDemon
      LegRight: RightLegDemon
      FootLeft: LeftFootDemon
      FootRight: RightFootDemon
      Brain: OrganHumanBrain
      Eyes: OrganHumanEyes
      Tongue: OrganHumanTongue
      Heart: OrganAnimalHeart
      Lungs: OrganHumanLungs
      Stomach: OrganDemonStomach
      Liver: OrganAnimalLiver
      Kidneys: OrganHumanKidneys

- type: entity
  save: false
  name: Urisst' Mzhand Demon
  parent:
  - AppearanceDemon
  - BaseSpeciesMobOrganic
  id: BaseMobDemon
  abstract: true
  components:
  - type: Interactions
  - type: HumanoidProfile
    species: Demon
  - type: SunriseHumanoidProfile
  - type: SunriseHumanoidBaseLayers
  - type: Hunger
  - type: Thirst
    dehydrationDamage:
      types:
        Bloodloss: 0.5
        Asphyxiation: 0.5
  - type: Icon
    sprite: _Sunrise/Mobs/Species/Demon/parts.rsi
    state: full_m
  - type: Sprite
    netsync: false
    noRot: true
    drawdepth: Mobs
  - type: Butcherable
    butcheringType: Spike
    spawned:
    - id: FoodMeatDemon
      amount: 5
  - type: Speech
    speechSounds: Lizard
  - type: Vocal
    sounds:
      Male: MaleHuman
      Female: FemaleHuman
      Unsexed: FemaleHuman
  - type: Damageable
    damageContainer: Biological
    damageModifierSet: Demon
  - type: MeleeDamageMultiplier
    multiplier: 0.7
  - type: HealingMultiplier
    multiplier: 0.6
  - type: MeleeWeapon
    hidden: true
    soundHit:
      path: /Audio/Weapons/pierce.ogg
    angle: 30
    animation: WeaponArcPunch
    damage:
      types:
        Piercing: 5
  - type: Temperature
    currentTemperature: 310.15
    specificHeat: 46
  - type: TemperatureDamage
    heatDamageThreshold: 600  #heat super-tolerant
    coldDamageThreshold: 280  #cold weakness, starting temperature damage treshold
    coldDamage:
      types:
        Cold : 0.5 #per second, scales with temperature & other constants
    heatDamage:
      types:
        Heat : 0.1 #per second, scales with temperature & other constants
  - type: Flammable
    minIgnitionTemperature: 500  #fire resistant, harder to ignite from ambient heat
  - type: FireProtection
    reduction: 0.5  #50% resistance to being on fire
  - type: MovementSpeedModifier
    baseWalkSpeed : 3.5
    baseSprintSpeed : 5.5
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
  - type: Perishable
  - type: FootprintEmitter
  # Огненный плевок демона (аналог Fire spew у импидов): экшен на хотбар, прицеливание и ЛКМ, как обычное оружие
  - type: ActionGun
    action: ActionDemonSpew
    gunProto: DemonSpewGun

- type: entity
  categories: [ HideSpawnMenu ]
  id: DemonSpewGun
  name: demon's maw
  description: For spewing a burning mixture.
  components:
  - type: SolutionContainerManager
    solutions:
      chamber:
        maxVol: 5
        reagents:
        - ReagentId: Thermite
          Quantity: 1
        - ReagentId: Phlogiston
          Quantity: 1
        - ReagentId: Napalm
          Quantity: 3
  - type: SolutionRegeneration
    solution: chamber
    generated:
      reagents:
      - ReagentId: Thermite
        Quantity: 1
      - ReagentId: Phlogiston
        Quantity: 1
      - ReagentId: Napalm
        Quantity: 3
    duration: 60
  - type: SolutionAmmoProvider
    solutionId: chamber
    fireCost: 5
    proto: ProjectileDemonSpew
  - type: Gun
    soundGunshot:
      path: /Audio/Animals/snake_hiss.ogg
    soundEmpty: null
    projectileSpeed: 5

- type: entity
  id: ProjectileDemonSpew
  name: burning bile
  categories: [ HideSpawnMenu ]
  components:
  - type: Clickable
  - type: Physics
    bodyType: Dynamic
  - type: TileFrictionModifier
    modifier: 0
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    damage:
      types:
        Blunt: 0
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: PointLight
    color: "#FF8C00"
    radius: 3.5
    energy: 3
  - type: Ammo
    muzzleFlash: null
  - type: SolutionContainerManager
    solutions:
      vapor:
        maxVol: 50
  - type: Fixtures
    fixtures:
      projectile:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.10,-0.30,0.10,0.15"
        hard: false
        mask:
        - Impassable
        - BulletImpassable
  - type: Vapor
    active: true
    transferAmountPercentage: 1

- type: entity
  parent: BaseAction
  id: ActionDemonSpew
  name: "[color=orange]Spew Combustible Mixture[/color]"
  description: Spew a burning mixture at your enemies.
  components:
  - type: Action
    icon: { sprite: Objects/Weapons/Guns/Projectiles/magic.rsi, state: fireball }
    itemIconStyle: BigAction
    priority: 2
  - type: TargetAction
    checkCanAccess: false
    range: 0
  - type: WorldTargetAction
    event: !type:ActionGunShootEvent

- type: entity
  save: false
  name: Urist McHands
  parent: AppearanceDemon
  id: MobDemonDummy
  categories: [ HideSpawnMenu ]
  description: A dummy reptilian meant to be used in character setup.
  components:
  - type: HumanoidProfile
    species: Demon
  - type: SunriseHumanoidProfile
  - type: SunriseHumanoidBaseLayers
  - type: Inventory
    femaleDisplacements:
      jumpsuit:
        sizeMaps:
          32:
            sprite: Mobs/Species/Human/displacement.rsi
            state: jumpsuit-female
