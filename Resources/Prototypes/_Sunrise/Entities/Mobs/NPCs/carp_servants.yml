- type: entity
  id: BaseMobCarpServant
  abstract: true
  components:
  - type: CarpQueenServant
  - type: CarpServantMemory
    biteReagentAmount: 1
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 2
        Slash: 3
  - type: HTN
    rootTask:
      task: RatServantCompound
    blackboard:
      IdleRange: !type:Single
        3.5
      FollowCloseRange: !type:Single
        2.0
      FollowRange: !type:Single
        3.0

- type: entity
