- type: entity
  id: BaseMobCarpServant
  abstract: true
  components:
  - type: CarpQueenServant
  - type: CarpServantMemory
    biteReagentAmount: 1
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 2
        Slash: 3
  - type: HTN
    rootTask:
      task: RatServantCompound
    blackboard:
      IdleRange: !type:Single
        3.5
      FollowCloseRange: !type:Single
        2.0
      FollowRange: !type:Single
        3.0

- type: entity
  id: MobCarpServantHolo
  parent: [ BaseMobCarpServant, MobCarpHolo ]

- type: entity
  id: MobCarpServantRainbow
  parent: [ BaseMobCarpServant, MobCarpRainbow ]

- type: entity
  id: MobCarpServantDragon
  parent: [ BaseMobCarpServant, MobCarpDragon ]
  components:
  - type: Puller
    needsHands: false
  - type: TTSRandom
    voices:
      "[Hearthstone] Финли": 10
      "[League of Legends] Твич": 10
      "[Skyrim] Ворожея": 10
      "[Warcraft 3] Мурадин": 10
      "[Warcraft] Гаррош Адский Крик": 10
      "[YouTube] PlayBoyzTV": 10
      "Мориарти": 5
      "Abaddon": 10
      "Achemist": 15
      "Batrider": 20
      "Bloodseeker": 10
      "Bounty Hunter": 20
      "Centaur Warrunner": 15
      "Clockwerk": 25
      "Gyrocopter": 15
      "Meepo": 10
      "Slark": 17
  - type: Speech
    speechVerb: Default  # Переопределяем LargeMob на Default для нормальной речи
  - type: Accentless
    removes:
    - type: ReplacementAccent
      accent: genericAggressive  # Убираем агрессивный акцент для нормальной речи

- type: entity
  id: MobCarpServantRegular
  parent: [ BaseMobCarpServant, MobCarp ]


