- type: entity
  id: RandomHumanoidSpawnerTSFMarine
  name: Solar Federation Marine
  components:
    - type: Sprite
      sprite: _Sunrise/Markers/jobs.rsi
      state: TSF
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirst
        - NamesMilitaryLast
      nameFormat: name-format-ert
    - type: RandomHumanoidSpawner
      settings: TSFMarine

- type: entity
  parent: RandomHumanoidSpawnerTSFMarine
  id: RandomHumanoidSpawnerTSFMarineLeader
  suffix: Leader
  components:
    - type: Sprite
      sprite: _Sunrise/Markers/jobs.rsi
      state: TSF
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirstLeader
        - NamesMilitaryLast
      nameFormat: name-format-ert
    - type: RandomHumanoidSpawner
      settings: TSFMarineLeader

- type: entity
  parent: RandomHumanoidSpawnerTSFMarine
  id: RandomHumanoidSpawnerTSFMARSOC
  suffix: MARSOC
  components:
    - type: Sprite
      sprite: _Sunrise/Markers/jobs.rsi
      state: TSF
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirstLeader
        - NamesMilitaryLast
      nameFormat: name-format-ert
    - type: RandomHumanoidSpawner
      settings: TSFMarineMARSOC

- type: randomHumanoidSettings
  id: TSFMarine
  parent: EventHumanoidMindShielded
  # speciesBlacklist:
  # - Arachnid
  # - Diona
  # - Moth
  # - SlimePerson
  # - Skeleton
  # - Vox
  # - Dwarf
  speciesWhitelist:
  - Human
  components:
    - type: GhostRole
      name: ghost-role-information-tsf-marine-name
      description: ghost-role-information-tsf-marine-desc
      rules: ghost-role-information-nonantagonist-rules
      requirements:
      - !type:OverallPlaytimeRequirement
          time: 72000 # 20h
      - !type:DepartmentTimeRequirement
          department: Security
          time: 18000 # 5h
      raffle:
        settings: default
      mindRoles:
      - MindRoleGhostCorporateAligned
      job: TSFMarine
    - type: Loadout
      prototypes: [ TSFMarineGear ]
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirst
        - NamesMilitaryLast
      nameFormat: name-format-ert
    - type: AutoImplant
      implants:
      - DeathRattleImplantTSF
      - MindShieldImplant

- type: randomHumanoidSettings
  id: TSFMarineLeader
  parent: TSFMarine
  components:
    - type: GhostRole
      name: ghost-role-information-tsf-leader-name
    - type: Loadout
      prototypes: [ TSFMarineLeaderGear ]
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirstLeader
        - NamesMilitaryLast
      nameFormat: name-format-ert

- type: randomHumanoidSettings
  id: TSFMarineMARSOC
  parent: TSFMarine
  components:
    - type: GhostRole
      name: ghost-role-information-tsf-MARSOC-name
    - type: Loadout
      prototypes: [ TSFEliteMarineGear ]
    - type: RandomMetadata
      nameSegments:
        - NamesMilitaryFirstLeader
        - NamesMilitaryLast
      nameFormat: name-format-ert
    - type: AutoImplant
      implants:
      - DeathRattleImplantTSF
      - DeathAcidifierImplant
      - MindShieldImplant
