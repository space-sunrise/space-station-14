- type: entity
  id: SunrisePoweredLightTubeSparkVisuals
  abstract: true
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Wallmounts/lighting/light_tube.rsi
    layers:
    - map: ["enum.PoweredLightLayers.Base"]
      state: base
    - map: ["enum.PoweredLightLayers.Glow"]
      state: glow
      shader: unshaded
    - map: ["sunrisePoweredLightFlicker"]
      state: spark-light1
      shader: unshaded
      visible: false
    - map: ["sunrisePoweredLightSparks"]
      state: spark-sparks1
      shader: unshaded
      visible: false
    state: base
  - type: SunrisePoweredLightSparks
    sparkSprite: _Sunrise/Structures/Wallmounts/lighting/light_tube.rsi
    states:
    - spark-light1
    - spark-light2
    - spark-light3
    - spark-light4
    sparkStates:
    - spark-sparks1
    - spark-sparks2

