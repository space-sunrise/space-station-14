- type: entity
  id: AlwaysPoweredFloorLight
  name: floor light
  suffix: Always powered
  parent: SmallLight
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Lighting/floor_lighting.rsi
    drawdepth: FloorObjects
    state: base
  - type: Construction
    graph: FloorLightFixture
    node: floorLight
  - type: PlacementReplacement
    key: floor_lights

- type: entity
  name: floor light
  description: A light fixture. Draws power and produces light when equipped with a light tube.
  id: FloorlightEmpty
  suffix: Empty
  parent: AlwaysPoweredFloorLight
  components:
  - type: Sprite
    sprite: _Sunrise/Structures/Lighting/floor_lighting.rsi
    state: empty
  - type: PointLight
    enabled: false
  - type: PoweredLight
    bulb: Bulb
  - type: ContainerContainer
    containers:
      light_bulb: !type:ContainerSlot
  - type: ApcPowerReceiver
  - type: ExtensionCableReceiver
  - type: DeviceNetwork
    deviceNetId: Wireless
    receiveFrequencyId: SmartLight
  - type: WirelessNetworkConnection
    range: 200
  - type: DeviceLinkSink
    ports:
      - On
      - Off
      - Toggle
  - type: Appearance
  - type: PoweredLightVisuals
    blinkingSound:
      path: "/Audio/Machines/light_tube_on.ogg"
    spriteStateMap:
      empty: empty
      off: base
      on: base
      broken: broken
      burned: burned
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand

- type: entity
  id: PoweredFloorlight
  parent: FloorlightEmpty
  components:
  - type: Sprite
    state: base
  - type: PointLight
    enabled: true
  - type: PoweredLight
    hasLampOnSpawn: LightBulb
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -15
    range: 2
    sound:
      path: /Audio/Ambience/Objects/light_hum.ogg
  - type: DamageOnInteract
    damage:
      types:
        Heat: 2
    popupText: powered-light-component-burn-hand
