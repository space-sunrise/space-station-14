- type: entity
  abstract: true
  # Абстрактный миксин задаёт общую визуализацию трещин: пять стадий на каждые 10 единиц урона, чтобы повреждения были заметны до разрушения стен.
  id: SunriseWallDamageVisualsBase
  components:
  - type: Appearance
  - type: DamageVisuals
    thresholds: [5, 10, 15, 20, 25]
    damageDivisor: 6
    trackAllDamage: true
    damageOverlay:
      sprite: _Sunrise/Structures/Walls/wall_cracks.rsi

# Варианты задают пять стадий трещин до первого порога смены или разрушения стены.
