#shuttle walls
- type: entity
  id: WallAbductorDiagonal
  name: shuttle wall
  suffix: Diagonal
  description: Keeps the air in and the greytide out.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Transform
    anchored: true
  - type: Clickable
  - type: Tag
    tags:
    - Wall
  - type: Sprite
    drawdepth: Walls
    sprite: _Sunrise/Abductor/Structures/Walls/abductor_diagonal.rsi
    state: state0
  - type: IconSmooth
    mode: Diagonal
    key: walls
    base: state
  - type: Icon
    sprite: _Sunrise/Abductor/Structures/Walls/abductor_diagonal.rsi
    state: state0
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallic
  - type: Physics
    bodyType: Static
  - type: Reflect
    reflects: Energy
    reflectProb: 1
  - type: Ricochetable
    chance: 1
  - type: Pullable
  - type: Airtight
    noAirWhenFullyAirBlocked: false
    airBlockedDirection:
    - South
    - East
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PolygonShape
            vertices:
            - "-0.5,-0.5"
            - "0.5,0.5"
            - "0.5,-0.5"
        mask:
        - FullTileMask
        layer:
        - WallLayer
  - type: Construction
    graph: Girder
    node: diagonalshuttleWall

- type: entity
  parent: BaseWall
  id: WallAbductor
  name: shuttle wall
  suffix: Reinforced, Exterior
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: StaticPrice
    price: 250
  - type: RadiationBlocker
    resistance: 5
  - type: Sprite
    sprite: _Sunrise/Abductor/Structures/Walls/abductor.rsi
  - type: Icon
    sprite: _Sunrise/Abductor/Structures/Walls/abductor.rsi
    state: full
  - type: Construction
    graph: Girder
    node: shuttleWall
  - type: IconSmooth
    key: walls
    base: state
  - type: Appearance
  - type: Ricochetable
    chance: 1

- type: entity
  parent: WallShuttleDiagonal
  id: WallShuttleDiagonalSD
  name: shuttle wall SD
  components:
  - type: Sprite
    drawdepth: Walls
    sprite: _Sunrise/Structures/Walls/shuttle_diagonal_SD.rsi
    state: state0
  - type: Icon
    sprite: _Sunrise/Structures/Walls/shuttle_diagonal_SD.rsi
    state: state0
  - type: Physics
    bodyType: Static
  - type: Ricochetable
    chance: 0.5
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Construction
    graph: Girder
    node: diagonalshuttleWallSD

- type: entity
  parent: WallShuttle
  id: WallShuttleSD
  name: shuttle wall SD
  components:
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: StructuralMetallicStrong
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 800
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
    - trigger:
        !type:DamageTrigger
        damage: 600
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalSlam
      - !type:ChangeConstructionNodeBehavior
        node: girder
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Sprite
    sprite: _Sunrise/Structures/Walls/shuttle_SD.rsi
  - type: Icon
    sprite: _Sunrise/Structures/Walls/shuttle_SD.rsi
    state: full
  - type: Construction
    graph: Girder
    node: shuttleWallSD
  - type: Reflect
    reflects: Energy
    reflectProb: 0.5
  - type: Ricochetable
    chance: 0.5
