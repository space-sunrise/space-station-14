- type: entity
  parent: AirlockSecurityGlassLocked
  id: PrisonCellDoor
  components:
  - type: PrisonCellDoor
  - type: DeviceLinkSink
    ports:
      - PrisonCellDoor_Lock
      - PrisonCellDoor_Unlock

- type: entity
  parent: Screen
  id: PrisonCellTimer
  components:
  - type: PrisonTimer
  - type: DeviceLinkSink
    ports:
      - PrisonTimer_Set
      - PrisonTimer_Reset
  - type: TextScreenVisuals
    textOffset: 0,3
    rowOffset: 6
    rows: 2
    rowLength: 6

- type: entity
  parent: LockerSecurity
  id: PrisonCellLocker
  components:
  - type: PrisonLocker
  - type: AccessReader
  - type: DeviceLinkSink
    ports:
      - PrisonLocker_Lock
      - PrisonLocker_Unlock
