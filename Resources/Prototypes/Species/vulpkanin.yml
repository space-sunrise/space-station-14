# TODO сейчас 4 вида вульп:
# прямые ноги, маленькая морда
# прямые ноги, большая морда
# изогнутые ноги, маленькая морда
# изогнутые ноги, большая морда
# НО тело всего ОДНО. Система бодитайпов не изменяет тело!
# То есть компонент Body содержит сейчас изогнутые ноги с маленькой мордой

- type: species
  id: Vulpkanin
  name: species-name-foxes
  roundStart: true
  prototype: MobVulpkanin
  bodyTypes:
  # оставил VulpkaninNormal чтобы у людей не сбрасывались их настройки
  - VulpkaninNormal # VulpkaninCurvedSmallMuzzle
  - VulpkaninStraightSmallMuzzle
  - VulpkaninCurvedBigMuzzle
  - VulpkaninStraightBigMuzzle
  defaultSkinTone: "#FFBBC3"
  skinColoration: Hues # было VulpkaninColors хз зачем
  markingLimits: MobVulpkaninMarkingLimits
  dollPrototype: MobVulpkaninDummy
  maleFirstNames: names_vulpkanin_male
  femaleFirstNames: names_vulpkanin_female
  maleLastNames: names_vulpkanin_last
  femaleLastNames: names_vulpkanin_last
  # Sunrise-Edit
  buttScan:
    sprite: /Textures/_Sunrise/CopyMachine/butts_scans.rsi
    state: human # SUNRISE-TODO: Спрайт жопы вульп
  # Sunrise-Edit

#- type: speciesBaseSprites
#  id: MobVulpkaninSprites
- type: bodyType
  id: VulpkaninNormal # VulpkaninCurvedSmallMuzzle
  name: body-curved-small-muzzle
  sprites:
    Head: MobVulpkaninHeadSmallMuzzle
    Hair: MobHumanoidAnyMarking
    FacialHair: MobHumanoidAnyMarking
    Snout: MobHumanoidAnyMarking
    SnoutCover: MobHumanoidAnyMarking
    # Sunrise-Start
    #UndergarmentTop: MobHumanoidAnyMarking
    #UndergarmentBottom: MobHumanoidAnyMarking
    # Sunrise-End
    Chest: MobVulpkaninTorso
    HeadTop: MobHumanoidAnyMarking
    HeadSide: MobHumanoidAnyMarking
    Tail: MobHumanoidAnyMarking
    Eyes: MobHumanoidEyes
    LArm: MobVulpkaninLArm
    RArm: MobVulpkaninRArm
    LHand: MobVulpkaninLHand
    RHand: MobVulpkaninRHand
    LLeg: MobVulpkaninCurvedLLeg
    RLeg: MobVulpkaninCurvedRLeg
    LFoot: MobVulpkaninCurvedLFoot
    RFoot: MobVulpkaninCurvedRFoot

- type: markingPoints # 6 points on arms and legs due to the "expected" marking usage. Two for hands, two for arms and 2 for claws. Can be lower once we have a distinction between LeftArm and RightArm instead of just Arms.
  id: MobVulpkaninMarkingLimits
  points:
    Hair:
      points: 1
      required: false
    FacialHair:
      points: 1
      onlyWhitelisted: true # Beards lack displacement maps and are impossible to displace onto a snout.
      required: false
    Snout:
      points: 1
      required: true
      defaultMarkings: [ VulpSnout ]
    SnoutCover:
      points: 3
      required: false
    Tail:
      points: 1
      required: true
      defaultMarkings: [ VulpTailVulp ]
    Head:
      points: 3
      required: false
    HeadTop:
      points: 1
      required: true
      defaultMarkings: [ VulpEar ]
    # Sunrise-Start
    #UndergarmentTop:
    #  points: 1
    #  required: false
    #UndergarmentBottom:
    #  points: 1
    #  required: false
    # Sunrise-End
    Arms:
      points: 6
      required: false
    Legs:
      points: 6
      required: false

