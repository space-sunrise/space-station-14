- type: entity
  parent: BaseAction
  id: ActionKnock
  name: Knock
  description: This spell opens nearby doors.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    sound: !type:SoundPathSpecifier
      path: /Audio/Magic/knock.ogg
    icon:
      sprite: Objects/Magic/magicactions.rsi
      state: knock
  - type: InstantAction
    event: !type:KnockSpellEvent
  - type: SpeakOnAction
    sentence: action-speech-spell-knock
  # Sunrise added start - золотое кольцо подчёркивает волну отпирающей магии.
  - type: TriggerOnActionPerformed
  - type: ParticleOnTrigger
    targetUser: true
    orchestras:
    - orchestra: MagicKnockCast
  # Sunrise added end
