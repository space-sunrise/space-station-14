- type: entity
  parent: BaseAction
  id: ActionChargeSpell
  name: Charge
  description: Adds a charge back to your wand
  components:
  - type: Action
    useDelay: 30
    itemIconStyle: BigAction
    icon:
      sprite: Objects/Weapons/Guns/Basic/wands.rsi
      state: nothing
  - type: InstantAction
    event: !type:ChargeSpellEvent
      charge: 1
  - type: SpeakOnAction
    sentence: action-speech-spell-charge
  # Sunrise added start - сходящиеся искры показывают восстановление магического заряда.
  - type: TriggerOnActionPerformed
  - type: ParticleOnTrigger
    targetUser: true
    orchestras:
    - orchestra: MagicChargeCast
  # Sunrise added end
