- type: entity
  parent: BaseAction
  id: ActionSmoke
  name: Smoke
  description: Summons smoke around the user.
  components:
  - type: Action
    useDelay: 10
    itemIconStyle: BigAction
    icon:
      sprite: Actions/smokeaction.rsi
      state: smokeaction
  - type: InstantAction
    event: !type:InstantSpawnSpellEvent
      prototype: WizardSmoke
      posData: !type:TargetInFront
  # Sunrise added start - фиолетовые мотыльки предваряют появление магического дыма.
  - type: TriggerOnActionPerformed
  - type: ParticleOnTrigger
    targetUser: true
    orchestras:
    - orchestra: MagicSmokeCast
  # Sunrise added end
