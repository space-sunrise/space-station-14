# 20mm autocannon ammunition for shuttle weapons.

- type: entity
  id: Cartridge20mmAutocannon
  parent: [BaseCartridge, BaseMajorContraband]
  name: 20mm autocannon shell
  description: A high-velocity 20mm shell for shuttle autocannons.
  components:
  - type: Tag
    tags:
    - Cartridge20mmAutocannon
  - type: Item
    size: Small
  - type: CartridgeAmmo
    proto: BulletLightRifleTraceFMJ
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/light_rifle_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#B68F0E"
  - type: Appearance

- type: entity
  id: Magazine20mmAutocannon
  parent: BaseMagazineGrenade
  name: 20mm autocannon magazine
  description: A 50-round drum magazine for the L85 20mm shuttle autocannon.
  components:
  - type: Tag
    tags:
    - Magazine20mmAutocannon
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - Cartridge20mmAutocannon
    proto: Cartridge20mmAutocannon
    capacity: 50
    soundRack:
      path: /Audio/Weapons/Guns/Bolt/lmg_bolt_closed.ogg
      params:
        variation: 0.05
    soundInsert:
      path: /Audio/Weapons/Guns/MagIn/rifle_load.ogg
      params:
        variation: 0.05
  - type: Item
    size: Huge
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Magazine/Grenade/grenade_cartridge.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: false
  - type: Appearance
